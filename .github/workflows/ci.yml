name: CI

on:
  push:
  pull_request:

jobs:
  host:
    name: Host build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - run: cmake --preset host -DTACHYON_WERROR=ON
      - run: cmake --build --preset host
      - run: ctest --preset host

  win95:
    name: Windows 95 build, checks and Wine tests
    runs-on: ubuntu-24.04
    env:
      WINEDEBUG: -all
      # Stop Wine offering to install Mono and Gecko when it creates a prefix.
      WINEDLLOVERRIDES: mscoree=;mshtml=
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64, Wine and packaging tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build mingw-w64 wine wine32:i386 xvfb xauth zip mtools genisoimage nsis
      - name: Prepare Wine
        run: wineboot --init && wineserver --wait
      - run: cmake --preset win95 -DTACHYON_WERROR=ON
      - name: Build (every .exe must pass win95check)
        run: cmake --build --preset win95
      - name: Test under Wine
        run: xvfb-run -a ctest --preset win95
      - name: Package (the installer must pass win95check too)
        run: tools/package.sh build/win95 dist
      - name: Install and uninstall under Wine
        run: xvfb-run -a tools/test_installer.sh dist/tachyon-*-win95-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: tachyon-win95
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.img
            dist/*.iso
            dist/*.txt

  fuzz:
    name: Fuzz the HTML parser (libFuzzer, ASan, UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang and its runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang libclang-rt-18-dev
      - name: Fuzz for three minutes
        run: tools/fuzz.sh 180 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: build/fuzz/crashes/

  real-sites:
    name: Real websites over HTTPS, parsed (packaged FETCH.EXE under Wine)
    needs: win95
    runs-on: ubuntu-24.04
    env:
      WINEDEBUG: -all
      WINEDLLOVERRIDES: mscoree=;mshtml=
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tachyon-win95
          path: artifact
      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32:i386 unzip
      - name: Prepare Wine
        run: wineboot --init && wineserver --wait
      - name: Fetch and parse real sites, trusting only Mozilla's roots
        run: |
          cd artifact && unzip -q tachyon-*-win95.zip
          failed=0
          for url in https://example.com/ \
                     https://en.wikipedia.org/wiki/Windows_95 \
                     https://news.ycombinator.com/ \
                     https://www.google.com/ \
                     https://github.com/ \
                     https://www.cloudflare.com/ \
                     https://www.bbc.co.uk/news \
                     https://www.yahoo.co.jp/ \
                     http://neverssl.com/; do
            ok=0
            for attempt in 1 2 3; do
              if wine TACHYON/FETCH.EXE -q --dom "$url"; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" = 0 ]; then echo "::error::FETCH.EXE could not load $url"; failed=1; fi
          done
          exit $failed

  # A tag v<version> publishes that build as a GitHub pre-release, once the
  # unit and Wine tests have passed. Push the tag, or publish a release with
  # a new tag on GitHub's website: then this job adds the files, and the
  # notes if it has none. The version must match CMakeLists.txt, and
  # docs/releases/<version>.md holds the notes (its first line is the title).
  release:
    name: Publish the GitHub release (version tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host, win95]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tachyon-win95
          path: dist
      - name: Create the release, or add the files to it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$GITHUB_REF_NAME
          version=${tag#v}
          notes=docs/releases/$version.md
          files="dist/tachyon-$version-win95-setup.exe dist/tachyon-$version-win95.zip
                 dist/tachyon-$version-win95.iso dist/tachyon-$version-win95.img
                 dist/tachyon-$version-win95-symbols.txt"
          for f in $files; do
            if [ ! -f "$f" ]; then echo "::error::no $f: does $tag match the version built? $(ls dist)"; exit 1; fi
          done
          if [ ! -f "$notes" ]; then echo "::error::$notes is missing"; exit 1; fi
          title=$(sed -n '1s/^# //p' "$notes")
          tail -n +3 "$notes" > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ -z "$(gh release view "$tag" --json body --jq .body)" ]; then
              gh release edit "$tag" --title "$title" --notes-file notes.md
            fi
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" --verify-tag --prerelease --title "$title" --notes-file notes.md $files
          fi
