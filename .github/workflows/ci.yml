name: CI

on:
  push:
  pull_request:

jobs:
  host:
    name: Host build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - run: cmake --preset host -DTACHYON_WERROR=ON
      - run: cmake --build --preset host
      - run: ctest --preset host

  win95:
    name: Windows 95 build, checks and Wine tests
    runs-on: ubuntu-24.04
    env:
      WINEDEBUG: -all
      # Stop Wine offering to install Mono and Gecko when it creates a prefix.
      WINEDLLOVERRIDES: mscoree=;mshtml=
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64, Wine and packaging tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build mingw-w64 wine wine32:i386 xvfb xauth zip mtools genisoimage
      - name: Prepare Wine
        run: wineboot --init && wineserver --wait
      - run: cmake --preset win95 -DTACHYON_WERROR=ON
      - name: Build (every .exe must pass win95check)
        run: cmake --build --preset win95
      - name: Test under Wine
        run: xvfb-run -a ctest --preset win95
      - name: Package
        run: tools/package.sh build/win95 dist
      - uses: actions/upload-artifact@v4
        with:
          name: tachyon-win95
          path: |
            dist/*.zip
            dist/*.img
            dist/*.iso
